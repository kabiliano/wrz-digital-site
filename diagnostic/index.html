<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Diagnostic — vos irritants du quotidien</title>
<meta name="description" content="Diagnostic express en 3 minutes : identifiez ce qui vous prend le plus de temps et d'énergie au quotidien, et repartez avec une première piste concrète.">
<link rel="canonical" href="https://wrz-digital.com/diagnostic/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wrz-digital.com/diagnostic/">
<meta property="og:title" content="Diagnostic express — qu'est-ce qui vous freine au quotidien ?">
<meta property="og:description" content="3 minutes pour identifier ce qui vous prend le plus de temps et d'énergie, et repartir avec une première piste concrète.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1A1D23;
    --bg-card: #2B303B;
    --bg-card-2: #23272F;
    --fg: #F4F5F7;
    --fg-muted: #939CAC;
    --accent: #E8A33D;
    --accent-soft: rgba(232,163,61,0.14);
    --success: #4FAE8C;
    --alert: #D9534F;
    --line: rgba(244,245,247,0.09);
    --radius: 20px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
  }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 24px 16px 40px;
    position: relative;
    overflow-x:hidden;
  }
  .blob{
    position:fixed; border-radius:50%; filter: blur(0px);
    background: var(--bg-card); z-index:0; pointer-events:none;
  }
  .blob-1{ width:340px; height:340px; top:-160px; right:-140px; }
  .blob-2{ width:260px; height:260px; bottom:-140px; left:-120px; }
  .blob-accent{ background: var(--accent); opacity:0.9; }

  .stage{
    width:100%; max-width: 460px; position:relative; z-index:1;
  }

  .topbar{
    display:flex; align-items:center; gap:12px; margin-bottom:22px;
  }
  .brand{
    font-family: var(--font-mono); font-size:11px; letter-spacing:0.14em;
    color: var(--fg-muted); text-transform:uppercase;
  }
  .gauge-track{
    flex:1; height:6px; border-radius:99px; background: rgba(244,245,247,0.08); overflow:hidden;
  }
  .gauge-fill{
    height:100%; width:0%; border-radius:99px;
    background: var(--success);
    transition: width 0.5s ease, background 0.5s ease;
  }
  .step-count{
    font-family: var(--font-mono); font-size:11px; color: var(--fg-muted); white-space:nowrap;
  }

  .card{
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 32px 26px 28px;
    border: 1px solid var(--line);
    animation: rise 0.45s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .eyebrow{
    font-family: var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color: var(--accent); margin-bottom:10px; display:block;
  }
  h1{
    font-family: var(--font-display); font-weight:600; font-size: 28px; line-height:1.18;
    margin: 0 0 10px;
  }
  h2{
    font-family: var(--font-display); font-weight:600; font-size: 23px; line-height:1.25;
    margin: 0 0 8px;
  }
  .sub{
    color: var(--fg-muted); font-size:14.5px; line-height:1.5; margin: 0 0 22px;
  }
  .intro-sub{ font-size:16px; line-height:1.55; margin-bottom: 28px; color: #C7CCD6; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom: 6px; }
  .opt{
    text-align:left; width:100%;
    background: var(--bg-card-2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 16px; font-family: var(--font-body); font-size:15px; font-weight:500;
    cursor:pointer; transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .opt:hover{ border-color: rgba(232,163,61,0.5); }
  .opt:active{ transform: scale(0.99); }
  .opt.selected{ border-color: var(--accent); background: var(--accent-soft); }
  .opt:focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; }
  .opt .opt-label{ display:block; }
  .opt .opt-sub{ display:block; font-size:12.5px; color:var(--fg-muted); margin-top:3px; font-weight:400; }

  textarea, input[type=text], input[type=email], input[type=tel]{
    width:100%; background: var(--bg-card-2); border: 1px solid var(--line);
    border-radius: 14px; color: var(--fg); font-family: var(--font-body); font-size:15px;
    padding: 14px 15px; margin-bottom:14px;
  }
  textarea{ min-height: 96px; resize: vertical; line-height:1.5; }
  textarea:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color: var(--accent); }
  label.field-label{ display:block; font-size:12.5px; color: var(--fg-muted); margin: 0 0 6px; font-family: var(--font-mono); letter-spacing:0.03em; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding: 15px 20px; border-radius: 14px; border:none;
    background: var(--accent); color: #1A1D23; font-family: var(--font-body);
    font-weight:700; font-size:15.5px; cursor:pointer; margin-top: 6px;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn:hover{ filter: brightness(1.07); }
  .btn:active{ transform: scale(0.99); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn:focus-visible{ outline: 2px solid #fff; outline-offset:2px; }
  .btn-ghost{
    background: transparent; color: var(--fg-muted); border: 1px solid var(--line);
    margin-top:10px; font-weight:600;
  }
  .btn-ghost:hover{ color: var(--fg); border-color: rgba(244,245,247,0.25); }

  .back{
    background:none; border:none; color: var(--fg-muted); font-family: var(--font-mono);
    font-size:12px; cursor:pointer; padding: 8px 0; margin-bottom: 4px; display:inline-flex; align-items:center; gap:6px;
  }
  .back:hover{ color: var(--fg); }

  .consent{
    display:flex; gap:10px; align-items:flex-start; margin: 4px 0 18px;
    font-size:12.5px; color: var(--fg-muted); line-height:1.5;
  }
  .consent input{ margin-top:3px; accent-color: var(--accent); width:auto; }

  /* Results */
  .bars{ display:flex; flex-direction:column; gap:16px; margin: 22px 0 26px; }
  .bar-row .bar-top{ display:flex; justify-content:space-between; margin-bottom:6px; font-size:13.5px; }
  .bar-row .bar-name{ font-weight:600; }
  .bar-row .bar-pct{ font-family: var(--font-mono); color: var(--fg-muted); }
  .bar-track{ height:10px; border-radius:99px; background: rgba(244,245,247,0.08); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; width:0%; transition: width 0.9s cubic-bezier(.2,.8,.2,1); }

  .highlight-box{
    background: var(--accent-soft); border: 1px solid rgba(232,163,61,0.35);
    border-radius: 14px; padding: 16px 17px; margin-bottom:18px;
  }
  .highlight-box .h-eyebrow{ font-family: var(--font-mono); font-size:10.5px; color: var(--accent); text-transform:uppercase; letter-spacing:0.1em; }
  .highlight-box p{ margin: 6px 0 0; font-size:14.5px; line-height:1.5; color: var(--fg); }

  .foot-note{
    text-align:center; margin-top:18px; font-size:12px; color: var(--fg-muted); line-height:1.6;
  }
  .foot-note a{ color: var(--fg-muted); }

  .success-check{
    width:52px; height:52px; border-radius:50%; background: rgba(79,174,140,0.15);
    display:flex; align-items:center; justify-content:center; margin-bottom:16px;
    border: 1px solid rgba(79,174,140,0.4);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  /* Admin */
  .admin-wrap{ max-width: 760px; }
  .admin-table{ width:100%; border-collapse: collapse; font-size:13px; margin-top:16px; }
  .admin-table th, .admin-table td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .admin-table th{ font-family: var(--font-mono); font-size:10.5px; color: var(--fg-muted); text-transform:uppercase; letter-spacing:0.05em; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-family: var(--font-mono); background: var(--accent-soft); color: var(--accent); }

  /* v2 : choix multiple, "pas concerné", canal de contact */
  .opt-multi{ display:flex; align-items:center; gap:12px; }
  .opt-multi .tick{ flex:0 0 18px; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--fg-muted); position:relative; }
  .opt-multi.selected .tick{ background: var(--accent); border-color: var(--accent); }
  .opt-multi.selected .tick::after{ content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #1A1D23; border-width:0 2px 2px 0; transform: rotate(45deg); }
  .opt-na{ background: transparent; border-style: dashed; }
  .opt-na .opt-label{ color: var(--fg-muted); }
  .row-2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin: 0 0 16px; }
  .chip{ background: var(--bg-card-2); color: var(--fg); border:1px solid var(--line); border-radius:99px; padding:9px 16px; font-family: var(--font-body); font-size:14px; font-weight:500; cursor:pointer; }
  .chip.selected{ border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip:focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; }
  @media (max-width: 360px){ .row-2{ grid-template-columns: 1fr; gap:0; } }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2 blob-accent" style="opacity:0.08;"></div>

  <div class="stage" id="stage"></div>

<script>
(function(){

  // ---------- Supabase config ----------
  const SUPABASE_URL = "https://cjlizuuaxucbpqykregv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_V-liQ8IOYnAFOLFXwDuDTw_EMprVMq1";
  const FORM_VERSION = 2;

  // ---------- Data model ----------
  const CATEGORIES = {
    devis_factures: { label: "Devis & factures", color: "#E8A33D" },
    paiements:      { label: "Paiements en retard", color: "#D9534F" },
    pilotage:       { label: "Rentabilité du mois", color: "#C9785B" },
    clients_agenda: { label: "RDV, appels & messages clients", color: "#8AA8E8" },
    visibilite:     { label: "Avis & visibilité en ligne", color: "#4FAE8C" },
    stocks:         { label: "Stocks & fournisseurs", color: "#A98BD9" },
  };

  const SCALE_OPTIONS = [
    { v:0, label:"Ça roule", sub:"rien à signaler" },
    { v:1, label:"Gênant de temps en temps", sub:"mais ça reste gérable" },
    { v:2, label:"Ça pèse chaque semaine", sub:"ça prend du temps et de l'énergie" },
    { v:3, label:"Point noir", sub:"ça m'épuise" },
  ];

  const STEPS = [
    { id:"intro", type:"intro" },

    // --- Profil ---
    { id:"secteur", type:"select",
      eyebrow:"Profil · 1 / 3",
      title:"Votre activité",
      sub:"Histoire qu'on ne vous parle pas d'un problème de boulanger si vous êtes plombier.",
      options:[
        {v:"commerce", label:"Commerce / boutique"},
        {v:"artisanat", label:"Artisan / bâtiment"},
        {v:"restauration", label:"Restauration / métiers de bouche"},
        {v:"bien_etre", label:"Bien-être / services à la personne"},
        {v:"liberal", label:"Profession libérale / indépendant"},
        {v:"b2b", label:"Services aux entreprises"},
        {v:"autre", label:"Autre"},
      ]
    },
    { id:"taille", type:"select",
      eyebrow:"Profil · 2 / 3",
      title:"Vous êtes combien ?",
      sub:"Vous compris.",
      options:[
        {v:"solo", label:"Seul(e)"},
        {v:"2-5", label:"2 à 5 personnes"},
        {v:"6-20", label:"6 à 20 personnes"},
        {v:"20+", label:"Plus de 20"},
      ]
    },
    { id:"outils", type:"multi",
      eyebrow:"Profil · 3 / 3",
      title:"Aujourd'hui, vous gérez avec…",
      sub:"Plusieurs réponses possibles.",
      options:[
        {v:"papier", label:"Papier / carnet"},
        {v:"tableur", label:"Excel ou Google Sheets"},
        {v:"logiciel", label:"Un logiciel métier"},
        {v:"rien", label:"Rien de particulier, tout est dans ma tête"},
      ]
    },

    // --- Frictions ---
    { id:"devis_factures", type:"scale",
      eyebrow:"Vos irritants · 1 / 6",
      title:"Faire vos devis et vos factures",
      sub:"À quel point ça vous pèse ?",
    },
    { id:"paiements", type:"scale",
      eyebrow:"Vos irritants · 2 / 6",
      title:"Courir après les paiements en retard",
      sub:"Relancer, attendre, relancer encore… à quel point ça vous pèse ?",
    },
    { id:"pilotage", type:"scale",
      eyebrow:"Vos irritants · 3 / 6",
      title:"Ne pas savoir, en cours de mois, si vous gagnez vraiment de l'argent",
      sub:"À quel point ça vous pèse ?",
    },
    { id:"clients_agenda", type:"scale",
      eyebrow:"Vos irritants · 4 / 6",
      title:"Gérer les rendez-vous, appels et messages clients",
      sub:"Planning, rappels, messages qui s'accumulent… à quel point ça vous pèse ?",
    },
    { id:"visibilite", type:"scale",
      eyebrow:"Vos irritants · 5 / 6",
      title:"Obtenir des avis et être trouvé en ligne",
      sub:"Fiche Google, avis clients, réseaux… à quel point ça vous pèse ?",
    },
    { id:"stocks", type:"scale", optional:true,
      eyebrow:"Vos irritants · 6 / 6",
      title:"Gérer vos stocks et vos commandes fournisseurs",
      sub:"Produits, pièces, matériel, matières premières… à quel point ça vous pèse ?",
    },

    // --- Qualification ---
    { id:"temps_perdu", type:"select",
      eyebrow:"Presque fini",
      title:"Tout ça vous prend combien de temps par semaine ?",
      sub:"Une estimation suffit — tout ce qui n'est pas votre métier.",
      options:[
        {v:"lt2", label:"Moins de 2 h"},
        {v:"2-5", label:"2 à 5 h"},
        {v:"5-10", label:"5 à 10 h"},
        {v:"10+", label:"Plus de 10 h"},
      ]
    },
    { id:"urgence", type:"select",
      eyebrow:"Presque fini",
      title:"Si votre plus gros irritant disparaissait demain, ce serait…",
      sub:"",
      options:[
        {v:0, label:"Sympa"},
        {v:1, label:"Vraiment utile"},
        {v:2, label:"Ça changerait mon quotidien"},
      ]
    },

    // --- Fin ---
    { id:"openText", type:"text",
      eyebrow:"Pour finir",
      title:"En une phrase :",
      sub:"Qu'est-ce qui vous prend le plus de temps ou d'énergie, aujourd'hui ?",
      placeholder:"Ex : je passe mes dimanches soirs sur les devis...",
    },
    { id:"contact", type:"contact",
      eyebrow:"Dernière étape",
      title:"Où vous recontacter ?",
      sub:"Aucun démarchage. On revient vers vous d'ici deux semaines avec une piste concrète, basée sur ce que vous venez de nous dire.",
    },
    { id:"results", type:"results" },
  ];

  const QUESTION_COUNT = STEPS.filter(s => !['intro','contact','results'].includes(s.type)).length;

  // ---------- State ----------
  let idx = 0;
  let answers = {
    secteur:null, taille:null, outils:[],
    devis_factures:null, paiements:null, pilotage:null, clients_agenda:null, visibilite:null,
    stocks:null, stocks_concerne:null,
    temps_perdu:null, urgence:null,
    openText:"", prenom:"", commerce:"", email:"", telephone:"", code_postal:"", canal:"email",
  };
  let submitting = false;
  let saveFailed = false;

  const stage = document.getElementById('stage');

  render();

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function currentProgress(){
    const answerable = STEPS.filter(s => s.type !== 'intro' && s.type !== 'results');
    const answeredCount = Math.min(idx, answerable.length);
    return Math.round((answeredCount / answerable.length) * 100);
  }

  function frictionAverage(){
    const vals = Object.keys(CATEGORIES).map(c => answers[c]).filter(v => v !== null && v !== undefined);
    if (!vals.length) return 0;
    return vals.reduce((a,b)=>a+b,0) / vals.length;
  }

  function gaugeColor(){
    const avg = frictionAverage();
    if (avg >= 2.1) return 'var(--alert)';
    if (avg >= 1.1) return 'var(--accent)';
    return 'var(--success)';
  }

  function topBar(){
    const pct = currentProgress();
    return `
      <div class="topbar">
        <span class="brand">Diagnostic irritants</span>
        <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%; background:${gaugeColor()};"></div></div>
        <span class="step-count">${pct}%</span>
      </div>
    `;
  }

  function header(step){
    return `<span class="eyebrow">${step.eyebrow}</span><h2>${step.title}</h2>${step.sub ? `<p class="sub">${step.sub}</p>` : '<div style="height:14px"></div>'}`;
  }

  function render(){
    const step = STEPS[idx];
    let html = '';

    if (step.type !== 'intro') html += topBar();

    html += '<div class="card">';

    if (step.type === 'intro') {
      html += `
        <span class="eyebrow">Diagnostic express · 3 minutes</span>
        <h1>Qu'est-ce qui vous freine vraiment, au quotidien ?</h1>
        <p class="intro-sub">${QUESTION_COUNT} questions rapides, presque toutes en un clic, pour identifier ce qui vous prend le plus de temps et d'énergie — et repartir avec une première piste concrète.</p>
        <button class="btn" id="start-btn">Commencer</button>
        <p class="foot-note">Vos réponses restent entre nous. On ne les utilise que pour vous recontacter.</p>
      `;
    }

    else if (step.type === 'select') {
      html += header(step);
      html += '<div class="options">';
      step.options.forEach(o => {
        const sel = answers[step.id] === o.v ? 'selected' : '';
        html += `<button class="opt ${sel}" data-value="${o.v}" data-step="${step.id}"><span class="opt-label">${o.label}</span></button>`;
      });
      html += '</div>';
    }

    else if (step.type === 'multi') {
      html += header(step);
      html += '<div class="options">';
      step.options.forEach(o => {
        const sel = answers[step.id].includes(o.v) ? 'selected' : '';
        html += `<button class="opt opt-multi ${sel}" data-multi="${o.v}" aria-pressed="${sel ? 'true' : 'false'}"><span class="tick" aria-hidden="true"></span><span class="opt-label">${o.label}</span></button>`;
      });
      html += '</div>';
      html += `<button class="btn" id="multi-continue" ${answers[step.id].length ? '' : 'disabled'}>Continuer</button>`;
    }

    else if (step.type === 'scale') {
      html += header(step);
      html += '<div class="options">';
      SCALE_OPTIONS.forEach(o => {
        const sel = answers[step.id] === o.v ? 'selected' : '';
        html += `<button class="opt ${sel}" data-value="${o.v}" data-step="${step.id}"><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span></button>`;
      });
      if (step.optional) {
        const sel = answers.stocks_concerne === false ? 'selected' : '';
        html += `<button class="opt opt-na ${sel}" data-value="na" data-step="${step.id}"><span class="opt-label">Pas concerné</span><span class="opt-sub">je n'ai pas de stock à gérer</span></button>`;
      }
      html += '</div>';
    }

    else if (step.type === 'text') {
      html += header(step);
      html += `<textarea id="open-text" placeholder="${step.placeholder}">${esc(answers.openText)}</textarea>`;
      html += `<button class="btn" id="text-continue">Continuer</button>`;
    }

    else if (step.type === 'contact') {
      html += header(step);
      const canal = (v, l) => `<button type="button" class="chip ${answers.canal === v ? 'selected' : ''}" data-canal="${v}" aria-pressed="${answers.canal === v}">${l}</button>`;
      html += `
        <label class="field-label" for="f-prenom">Prénom</label>
        <input type="text" id="f-prenom" autocomplete="given-name" value="${esc(answers.prenom)}">
        <label class="field-label" for="f-commerce">Nom de votre entreprise / activité</label>
        <input type="text" id="f-commerce" autocomplete="organization" value="${esc(answers.commerce)}">
        <label class="field-label" for="f-email">Email</label>
        <input type="email" id="f-email" autocomplete="email" value="${esc(answers.email)}">
        <div class="row-2">
          <div>
            <label class="field-label" for="f-tel">Téléphone <span style="opacity:0.6">(optionnel)</span></label>
            <input type="tel" id="f-tel" autocomplete="tel" value="${esc(answers.telephone)}">
          </div>
          <div>
            <label class="field-label" for="f-cp">Code postal</label>
            <input type="text" id="f-cp" inputmode="numeric" maxlength="5" autocomplete="postal-code" value="${esc(answers.code_postal)}">
          </div>
        </div>
        <span class="field-label">On vous recontacte plutôt par…</span>
        <div class="chips">${canal('email','Email')}${canal('telephone','Téléphone')}${canal('sms','SMS')}</div>
        <div class="consent">
          <input type="checkbox" id="f-consent" ${answers._consent ? 'checked' : ''}>
          <label for="f-consent">J'accepte d'être recontacté(e) au sujet de ce diagnostic. Pas de spam, pas de revente de données.</label>
        </div>
        <button class="btn" id="contact-submit" ${submitting ? 'disabled' : ''}>${submitting ? 'Envoi...' : 'Voir mon diagnostic'}</button>
      `;
    }

    else if (step.type === 'results') {
      html += renderResults();
    }

    html += '</div>';

    if (step.type !== 'intro' && step.type !== 'results' && idx > 1) {
      html = `<button class="back" id="back-btn">&larr; retour</button>` + html;
    }

    stage.innerHTML = html;
    attachHandlers(step);
  }

  function readContactFields(){
    const v = id => (document.getElementById(id)?.value || '').trim();
    answers.prenom = v('f-prenom');
    answers.commerce = v('f-commerce');
    answers.email = v('f-email');
    answers.telephone = v('f-tel');
    answers.code_postal = v('f-cp');
    const c = document.getElementById('f-consent');
    if (c) answers._consent = c.checked;
  }

  function attachHandlers(step){
    const startBtn = document.getElementById('start-btn');
    if (startBtn) startBtn.onclick = () => { idx++; render(); };

    const backBtn = document.getElementById('back-btn');
    if (backBtn) backBtn.onclick = () => {
      if (step.type === 'contact') readContactFields();
      idx--; render();
    };

    // Choix unique (select + échelles)
    document.querySelectorAll('.opt[data-step]').forEach(btn => {
      btn.onclick = () => {
        const key = btn.getAttribute('data-step');
        const raw = btn.getAttribute('data-value');
        if (key === 'stocks') {
          if (raw === 'na') { answers.stocks = null; answers.stocks_concerne = false; }
          else { answers.stocks = parseInt(raw, 10); answers.stocks_concerne = true; }
        } else {
          answers[key] = isNaN(raw) ? raw : parseInt(raw, 10);
        }
        idx++;
        render();
      };
    });

    // Choix multiple (outils)
    document.querySelectorAll('.opt[data-multi]').forEach(btn => {
      btn.onclick = () => {
        const v = btn.getAttribute('data-multi');
        let list = answers[step.id];
        if (v === 'rien') list = list.includes('rien') ? [] : ['rien'];
        else {
          list = list.filter(x => x !== 'rien');
          list = list.includes(v) ? list.filter(x => x !== v) : [...list, v];
        }
        answers[step.id] = list;
        render();
      };
    });
    const multiContinue = document.getElementById('multi-continue');
    if (multiContinue) multiContinue.onclick = () => { idx++; render(); };

    const textContinue = document.getElementById('text-continue');
    if (textContinue) textContinue.onclick = () => {
      answers.openText = document.getElementById('open-text').value.trim();
      idx++;
      render();
    };

    document.querySelectorAll('.chip[data-canal]').forEach(chip => {
      chip.onclick = () => {
        readContactFields();
        answers.canal = chip.getAttribute('data-canal');
        render();
      };
    });

    const contactSubmit = document.getElementById('contact-submit');
    if (contactSubmit) contactSubmit.onclick = async () => {
      readContactFields();

      if (!answers.prenom || !answers.email) {
        flashError('Prénom et email sont nécessaires pour qu\'on puisse revenir vers vous.');
        return;
      }
      if ((answers.canal === 'telephone' || answers.canal === 'sms') && !answers.telephone) {
        flashError('Indiquez un numéro pour être recontacté(e) par téléphone ou SMS.');
        return;
      }
      if (answers.code_postal && !/^\d{5}$/.test(answers.code_postal)) {
        flashError('Le code postal doit faire 5 chiffres.');
        return;
      }
      if (!answers._consent) {
        flashError('Cochez la case pour qu\'on puisse vous recontacter.');
        return;
      }
      submitting = true;
      saveFailed = false;
      render();
      await saveLead();
      submitting = false;
      if (saveFailed) {
        render();
        flashError('La connexion a coupé, vos réponses n\'ont pas pu être envoyées. Réessayez.');
        return;
      }
      idx++;
      render();
    };
  }

  function flashError(msg){
    const existing = document.getElementById('form-error');
    if (existing) existing.remove();
    const card = document.querySelector('.card');
    const el = document.createElement('p');
    el.id = 'form-error';
    el.setAttribute('role', 'alert');
    el.style.cssText = 'color:#D9534F;font-size:13px;margin:-10px 0 14px;';
    el.textContent = msg;
    card.insertBefore(el, card.querySelector('.btn'));
  }

  function rankedCategories(){
    return Object.keys(CATEGORIES)
      .filter(c => answers[c] !== null && answers[c] !== undefined)
      .map(c => ({
        key: c,
        label: CATEGORIES[c].label,
        color: CATEGORIES[c].color,
        value: answers[c],
        pct: Math.round((answers[c] / 3) * 100),
      }))
      .sort((a,b) => b.value - a.value);
  }

  function renderResults(){
    const ranked = rankedCategories();
    const top = ranked[0];

    const teaser = {
      devis_factures: "Des devis et factures qui se préparent presque tout seuls, à partir de vos infos habituelles — plus besoin d'y passer vos soirées.",
      paiements: "Des relances de paiement envoyées automatiquement au bon moment, avec le bon ton, sans que vous ayez à y penser.",
      pilotage: "Un suivi simple qui vous dit en cours de mois où vous en êtes, sans attendre le bilan pour découvrir la surprise.",
      clients_agenda: "Des rendez-vous, rappels et réponses aux messages clients qui se gèrent en partie seuls, pour garder la tête dans votre métier.",
      visibilite: "Une gestion de vos avis et de votre présence en ligne qui tourne en fond, sans y passer vos soirées.",
      stocks: "Un suivi de stock qui vous prévient avant la rupture et prépare vos commandes fournisseurs à l'avance.",
    };

    const tempsLabel = { lt2:"moins de 2 h", "2-5":"2 à 5 h", "5-10":"5 à 10 h", "10+":"plus de 10 h" }[answers.temps_perdu];

    let html = `
      <div class="success-check">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#4FAE8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="eyebrow">Votre diagnostic</span>
      <h1 style="font-size:24px;">Voici ce qui ressort de vos réponses</h1>
      <p class="sub">Merci ${esc(answers.prenom)}. Rien d'officiel ici — juste une photo de ce qui pèse le plus aujourd'hui${tempsLabel ? `, pour <strong style="color:var(--fg)">${tempsLabel}</strong> de votre temps chaque semaine` : ''}.</p>
      <div class="bars">
    `;

    ranked.forEach(r => {
      html += `
        <div class="bar-row">
          <div class="bar-top"><span class="bar-name">${r.label}</span><span class="bar-pct">${r.pct}%</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="${r.pct}" style="background:${r.color};"></div></div>
        </div>
      `;
    });

    html += `</div>`;

    if (top && top.value > 0) {
      html += `
        <div class="highlight-box">
          <span class="h-eyebrow">Votre point le plus chaud</span>
          <p><strong>${top.label}</strong> — ${teaser[top.key]}</p>
        </div>
      `;
    } else {
      html += `
        <div class="highlight-box">
          <span class="h-eyebrow">Bonne nouvelle</span>
          <p>Rien ne ressort vraiment : vous avez l'air d'avoir les choses bien en main. On reviendra quand même vers vous si une idée peut vous faire gagner du temps.</p>
        </div>
      `;
    }

    html += `<p class="foot-note">On repart avec tout ça, et on revient vers vous d'ici deux semaines avec quelque chose de concret, pensé pour votre situation. Pas de pitch, pas de pression.</p>`;

    setTimeout(() => {
      document.querySelectorAll('.bar-fill').forEach(el => {
        const pct = el.getAttribute('data-pct');
        requestAnimationFrame(() => { el.style.width = pct + '%'; });
      });
    }, 50);

    return html;
  }

  async function saveLead(){
    const payload = {
      form_version: FORM_VERSION,
      secteur: answers.secteur,
      taille: answers.taille,
      outils: answers.outils,
      devis_factures: answers.devis_factures,
      paiements: answers.paiements,
      pilotage: answers.pilotage,
      clients_agenda: answers.clients_agenda,
      visibilite: answers.visibilite,
      stocks: answers.stocks,
      stocks_concerne: answers.stocks_concerne,
      temps_perdu: answers.temps_perdu,
      urgence: answers.urgence,
      open_text: answers.openText,
      prenom: answers.prenom,
      commerce: answers.commerce,
      email: answers.email,
      telephone: answers.telephone,
      code_postal: answers.code_postal || null,
      canal: answers.canal,
      consent: !!answers._consent,
    };
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/diagnostic_leads`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        console.error('Erreur Supabase', res.status, await res.text());
        saveFailed = true;
      }
    } catch (e) {
      console.error('Erreur réseau', e);
      saveFailed = true;
    }
  }

})();
</script>
</body>
</html>
