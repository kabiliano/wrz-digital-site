<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta property="og:description" content="Découvrez WRZ Ops en 4 cas d'usage réels.">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0c10">
<style>
@font-face { font-family: 'Syne'; src: url(/fonts/syne.woff2) format('woff2'); font-weight: 400 800; font-display: swap; }
@font-face { font-family: 'DM Mono'; src: url(/fonts/dmmono-regular.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'DM Mono'; src: url(/fonts/dmmono-medium.woff2) format('woff2'); font-weight: 500; font-display: swap; }

:root {
  --bg: #0a0c10; --bg2: #12151c; --bg3: #171b24; --bg4: #1d2230;
  --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.15);
  --accent: #00e0a0; --accent-dim: rgba(0,224,160,.12);
  --accent2: #0088ff; --accent2-dim: rgba(0,136,255,.12);
  --warn: #ffaa00; --warn-dim: rgba(255,170,0,.12);
  --text: #e7e9f3; --text2: #8890a8; --text3: #454b62;
  --display: 'Syne', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, Consolas, monospace;
}
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #000; color: var(--text); font-family: var(--display);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

.stage {
  width: 100%; max-width: 460px; height: 100%; max-height: 860px;
  background: var(--bg); position: relative; overflow: hidden;
  border-radius: 0;
}
@media (min-width: 480px) and (min-height: 900px) {
  .stage { border-radius: 28px; box-shadow: 0 60px 120px -40px rgba(0,0,0,.8); border: 1px solid var(--border2); }
}

.stage-glow {
  position: absolute; top: -160px; left: 50%; transform: translateX(-50%);
  width: 620px; height: 420px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse at center, var(--scene-glow, rgba(0,224,160,.16)), transparent 70%);
  transition: background 0.6s ease; z-index: 0;
}

/* progress bars, IG-story style */
.progress-row { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 5px; z-index: 20; }
.progress-seg { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
.progress-fill { height: 100%; width: 0%; background: var(--text); border-radius: 2px; }
.progress-seg.done .progress-fill { width: 100%; }
.progress-seg.active .progress-fill { animation: fillbar linear forwards; animation-duration: var(--dur, 8s); }
@keyframes fillbar { from { width: 0%; } to { width: 100%; } }

.topbar { position: absolute; top: 30px; left: 18px; right: 18px; z-index: 20; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; }
.brand-mark span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.brand strong { font-size: 12px; letter-spacing: .08em; }
.close-hint { font-family: var(--mono); font-size: 10px; color: var(--text3); }

.scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .35s ease; display: flex; flex-direction: column; z-index: 1; }
.scene.active { opacity: 1; pointer-events: auto; }

.scene-head { padding: 72px 22px 0; position: relative; z-index: 5; }
.scene-eyebrow { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; color: var(--scene-accent, var(--accent)); text-transform: uppercase; display: inline-flex; align-items: center; gap: 7px; }
.scene-eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--scene-accent, var(--accent)); box-shadow: 0 0 6px var(--scene-accent, var(--accent)); }
.scene-tagline { font-size: 21px; font-weight: 700; line-height: 1.22; margin-top: 10px; text-wrap: balance; }

.scene-chat { flex: 1; overflow: hidden; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end; position: relative; z-index: 5; }
.msg { display: flex; gap: 8px; max-width: 92%; opacity: 0; transform: translateY(8px); animation: msgIn .4s ease forwards; }
.msg.user { flex-direction: row-reverse; margin-left: auto; }
.msg.meta { max-width: 100%; margin: 2px auto; }
.avatar { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 8px; margin-top: 2px; }
.avatar.ai { background: var(--accent-dim); border: 1px solid rgba(0,224,160,.3); color: var(--accent); }
.avatar.me { background: var(--accent2-dim); border: 1px solid rgba(0,136,255,.3); color: var(--accent2); }
.bubble { background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font-size: 12.5px; line-height: 1.5; }
.msg.user .bubble { background: var(--accent2-dim); border-color: rgba(0,136,255,.18); }
.msg.meta .bubble { background: var(--warn-dim); border-color: rgba(255,170,0,.25); color: var(--text2); font-family: var(--mono); font-size: 10.5px; text-align: center; padding: 5px 12px; border-radius: 20px; }
.bubble .agent-tag { display: block; font-family: var(--mono); font-size: 9px; color: var(--accent); margin-bottom: 3px; letter-spacing: .04em; }
.bubble .source { display: inline-flex; margin-top: 6px; font-family: var(--mono); font-size: 8.5px; color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(0,224,160,.25); padding: 2px 7px; border-radius: 4px; }
.bubble .urgence { display: inline-block; font-family: var(--mono); font-size: 8.5px; color: var(--warn); background: var(--warn-dim); border: 1px solid rgba(255,170,0,.3); padding: 2px 7px; border-radius: 4px; margin-bottom: 6px; }
.typing { display: inline-flex; gap: 3px; }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--text3); animation: blink 1.2s infinite; display: block; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
@keyframes msgIn { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; opacity: 1; transform: none; } }

.scene-footer { padding: 16px 20px 28px; position: relative; z-index: 5; }
.scene-footer p { font-size: 12px; color: var(--text2); }

/* nav zones */
.nav-zone { position: absolute; top: 0; bottom: 0; width: 34%; z-index: 15; cursor: pointer; }
.nav-zone.left { left: 0; }
.nav-zone.right { right: 0; }
.nav-arrows { position: absolute; bottom: 30px; right: 18px; display: flex; gap: 8px; z-index: 20; }
.nav-btn { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid var(--border2); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
.nav-btn:hover { background: rgba(255,255,255,.14); }

/* CTA scene */
.cta-scene { align-items: center; justify-content: center; text-align: center; padding: 0 32px; gap: 16px; }
.cta-mark { width: 52px; height: 52px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.cta-mark span { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.cta-scene h2 { font-size: 26px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.cta-scene p { font-size: 13.5px; color: var(--text2); max-width: 30ch; }
.cta-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; margin-top: 8px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--mono); font-size: 12.5px; font-weight: 500; letter-spacing: .04em; padding: 13px 20px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--accent); color: #05130f; }
.btn-ghost { background: transparent; border-color: var(--border2); color: var(--text); }

::selection { background: var(--accent); color: #05130f; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="stage-glow" id="stageGlow"></div>
  <div class="progress-row" id="progressRow"></div>
  <div class="topbar">
    <div class="brand"><div class="brand-mark"><span></span></div><strong>WRZ OPS</strong></div>
    <div class="close-hint" id="sceneCounter">1 / 5</div>
  </div>

  <div id="scenesContainer"></div>

  <div class="nav-zone left" onclick="prevScene()"></div>
  <div class="nav-zone right" onclick="nextScene()"></div>
  <div class="nav-arrows">
    <div class="nav-btn" onclick="prevScene()">‹</div>
    <div class="nav-btn" onclick="nextScene()">›</div>
  </div>
</div>

<script>
const SCENES = [
  {
    accent: '#00e0a0', glow: 'rgba(0,224,160,.18)',
    eyebrow: 'Maintenance industrielle',
    tagline: "Le bon diagnostic, sourcé, en quelques secondes.",
    footer: "Un technicien pose la question — l'agent répond avec la procédure exacte, pas une supposition.",
    messages: [
      { role: 'user', text: "Le compresseur B2 se met en sécurité dès le démarrage, je vérifie quoi en premier ?" },
      { role: 'ai', text: "Contrôlez d'abord la pression d'huile au démarrage — c'est la cause la plus fréquente sur ce modèle. Si elle est correcte, passez au pressostat HP.", source: "Procédure-B2-maintenance.pdf" }
    ]
  },
  {
    accent: '#ffaa00', glow: 'rgba(255,170,0,.16)',
    eyebrow: 'Gestion de patrimoine — triage email',
    tagline: "Un email de locataire devient une réponse prête à valider.",
    footer: "L'email arrive, l'agent évalue l'urgence et rédige la réponse — un humain valide avant l'envoi.",
    messages: [
      { role: 'user', text: "Objet : Fuite d'eau urgente\n\nBonjour, il y a une fuite active sous l'évier depuis ce matin, ça continue de couler. Merci d'intervenir rapidement." },
      { role: 'meta', text: 'Routé vers Plomberie' },
      { role: 'ai', agent: 'Plomberie', urgence: 'URGENCE 4/5', text: "Merci de couper l'arrivée d'eau générale immédiatement si possible. Un plombier est contacté en urgence et intervient dans les prochaines heures." }
    ]
  },
  {
    accent: '#0088ff', glow: 'rgba(0,136,255,.18)',
    eyebrow: 'PME — management & RH',
    tagline: "Un vrai conseil de dirigeant, pas une réponse générique.",
    footer: "Chaque agent connaît le contexte réel de l'entreprise, pas juste des principes de management génériques.",
    messages: [
      { role: 'user', text: "Comment je structure mon premier cycle d'entretiens annuels pour une équipe de 12 ?" },
      { role: 'ai', text: "Commencez simple : une grille commune (objectifs, compétences, évolution), 45 min par entretien, et formez vos 2 managers avant de lancer la première vague.", source: "Guide-entretiens-annuels.pdf" }
    ]
  },
  {
    accent: '#00e0a0', glow: 'rgba(0,224,160,.18)',
    eyebrow: 'Consultation multi-experts',
    tagline: "Plusieurs avis d'experts, une seule conclusion claire.",
    footer: "Les experts ne répondent jamais chacun dans leur coin — leurs avis sont croisés en une synthèse finale.",
    messages: [
      { role: 'user', text: "On valide cette analyse avant de se positionner sur le match ?" },
      { role: 'meta', text: 'Consultation multi-experts · Analyse Match · Value Betting' },
      { role: 'ai', agent: 'Analyse Match', text: "Forme récente favorable à l'équipe A, probabilité de victoire estimée à 54%." },
      { role: 'ai', agent: 'Value Betting', text: "Cote à 2.10 → value positive d'environ +8% par rapport à la probabilité estimée." },
      { role: 'meta', text: 'Synthèse des experts' },
      { role: 'ai', text: "Les deux analyses convergent : forme et cote sont alignées. Recommandation : position mesurée, 2% de bankroll maximum." }
    ]
  }
];

const SCENE_DURATION = 9000;
let current = 0;
let timer = null;
let paused = false;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function initials(role) { return role === 'user' ? 'MOI' : 'IA'; }

function buildSceneDOM(scene, index) {
  const el = document.createElement('div');
  el.className = 'scene';
  el.style.setProperty('--scene-accent', scene.accent);
  el.dataset.index = index;
  el.innerHTML = `
    <div class="scene-head">
      <span class="scene-eyebrow"><span class="dot"></span>${scene.eyebrow}</span>
      <div class="scene-tagline">${scene.tagline}</div>
    </div>
    <div class="scene-chat" id="chat-${index}"></div>
    <div class="scene-footer"><p>${scene.footer}</p></div>
  `;
  return el;
}

function buildCTAScene(index) {
  const el = document.createElement('div');
  el.className = 'scene cta-scene';
  el.dataset.index = index;
  el.innerHTML = `
    <div class="cta-mark"><span></span></div>
    <h2>Votre équipe a maintenant un collègue qui ne dort jamais.</h2>
    <p>Un agent IA différent pour chaque métier, toujours sourcé, jamais isolé.</p>
    <div class="cta-btns">
      <a class="btn btn-primary" href="https://ops.wrz-digital.com/essai.html" target="_blank" rel="noopener">Essayer gratuitement →</a>
      <a class="btn btn-ghost" href="https://wrz-digital.com/tarifs/" target="_blank" rel="noopener">Voir les tarifs</a>
    </div>
  `;
  return el;
}

const container = document.getElementById('scenesContainer');
SCENES.forEach((s, i) => container.appendChild(buildSceneDOM(s, i)));
container.appendChild(buildCTAScene(SCENES.length));
const TOTAL = SCENES.length + 1;

const progressRow = document.getElementById('progressRow');
for (let i = 0; i < TOTAL; i++) {
  const seg = document.createElement('div');
  seg.className = 'progress-seg';
  seg.innerHTML = '<div class="progress-fill"></div>';
  progressRow.appendChild(seg);
}

function renderChat(index) {
  const scene = SCENES[index];
  if (!scene) return;
  const chatEl = document.getElementById(`chat-${index}`);
  chatEl.innerHTML = '';

  function playRow(i) {
    if (i >= scene.messages.length) return;
    const msg = scene.messages[i];
    const row = document.createElement('div');
    row.className = 'msg ' + msg.role;

    if (msg.role === 'meta') {
      row.innerHTML = `<div class="bubble">${msg.text}</div>`;
      chatEl.appendChild(row);
      setTimeout(() => playRow(i + 1), reduced ? 0 : 380);
      return;
    }

    const avatarClass = msg.role === 'user' ? 'me' : 'ai';
    row.innerHTML = `<div class="avatar ${avatarClass}">${initials(msg.role)}</div><div class="bubble"></div>`;
    chatEl.appendChild(row);
    const bubble = row.querySelector('.bubble');

    const prefix = (msg.urgence ? `<span class="urgence">${msg.urgence}</span><br>` : '') +
      (msg.agent ? `<span class="agent-tag">${msg.agent}</span>` : '');

    if (reduced) {
      bubble.innerHTML = prefix + msg.text.replace(/\n/g, '<br>') + (msg.source ? `<div class="source">* ${msg.source}</div>` : '');
      playRow(i + 1);
      return;
    }

    bubble.innerHTML = prefix;
    const typing = document.createElement('span');
    typing.className = 'typing';
    typing.innerHTML = '<i></i><i></i><i></i>';
    bubble.appendChild(typing);

    setTimeout(() => {
      bubble.innerHTML = prefix;
      let charIdx = 0;
      const iv = setInterval(() => {
        bubble.innerHTML = prefix + msg.text.slice(0, charIdx).replace(/\n/g, '<br>');
        charIdx += 3;
        if (charIdx > msg.text.length) {
          clearInterval(iv);
          bubble.innerHTML = prefix + msg.text.replace(/\n/g, '<br>') + (msg.source ? `<div class="source">* ${msg.source}</div>` : '');
          playRow(i + 1);
        }
      }, 13);
    }, msg.role === 'user' ? 100 : 450);
  }

  playRow(0);
}

function goTo(index, direction) {
  if (index < 0) index = 0;
  if (index >= TOTAL) index = TOTAL - 1;
  current = index;

  document.querySelectorAll('.scene').forEach((el) => el.classList.toggle('active', +el.dataset.index === index));
  document.getElementById('sceneCounter').textContent = `${index + 1} / ${TOTAL}`;

  const segs = progressRow.children;
  for (let i = 0; i < segs.length; i++) {
    segs[i].classList.remove('active');
    segs[i].classList.toggle('done', i < index);
    if (i === index) {
      segs[i].querySelector('.progress-fill').style.animation = 'none';
      void segs[i].offsetWidth;
    }
  }

  const scene = SCENES[index];
  const glowColor = scene ? scene.glow : 'rgba(0,224,160,.16)';
  document.getElementById('stageGlow').style.setProperty('--scene-glow', glowColor);

  if (scene) renderChat(index);

  clearTimeout(timer);
  if (index < SCENES.length) {
    segs[index].classList.add('active');
    segs[index].style.setProperty('--dur', SCENE_DURATION + 'ms');
    if (!reduced) {
      const fill = segs[index].querySelector('.progress-fill');
      fill.style.animation = `fillbar linear forwards`;
      fill.style.animationDuration = SCENE_DURATION + 'ms';
    } else {
      segs[index].querySelector('.progress-fill').style.width = '100%';
    }
    if (!paused) timer = setTimeout(() => goTo(index + 1), SCENE_DURATION);
  } else {
    segs[index].classList.add('done');
    segs[index].querySelector('.progress-fill').style.width = '100%';
  }
}

function nextScene() { goTo(current + 1); }
function prevScene() { goTo(current - 1); }

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextScene();
  if (e.key === 'ArrowLeft') prevScene();
});

const stageEl = document.getElementById('stage');
stageEl.addEventListener('mousedown', () => {
  paused = true; clearTimeout(timer);
  document.querySelectorAll('.progress-seg.active .progress-fill').forEach(f => f.style.animationPlayState = 'paused');
});
stageEl.addEventListener('mouseup', () => {
  paused = false;
  document.querySelectorAll('.progress-seg.active .progress-fill').forEach(f => f.style.animationPlayState = 'running');
  const remaining = SCENE_DURATION;
  timer = setTimeout(() => goTo(current + 1), remaining);
});

goTo(0);
</script>
</body>
</html>
